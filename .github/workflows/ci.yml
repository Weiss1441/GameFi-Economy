name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      ETH_MAINNET_RPC: ${{ secrets.ETH_MAINNET_RPC }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Install Slither
        run: pipx install slither-analyzer

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Run Solhint
        run: npx --yes solhint@latest "src/**/*.sol" "script/**/*.sol" "test/**/*.sol"

      - name: Run Prettier
        run: npx --yes prettier@latest --check "frontend/**/*.{html,css,js}" "subgraph/schema.graphql" "subgraph/subgraph.yaml" "subgraph/src/**/*.ts"

      - name: Build contracts
        run: |
          forge clean
          forge build

      - name: Run tests
        run: forge test

      - name: Generate coverage
        run: forge coverage --report summary

      - name: Run Slither
        run: slither . --filter-paths "lib|node_modules|out|cache|broadcast" --fail-high --fail-medium
