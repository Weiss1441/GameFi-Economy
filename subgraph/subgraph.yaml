specVersion: 0.0.5

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: ResourceAMM
    network: arbitrum-sepolia
    source:
      address: "0x9fF4608bAEb3a055CcBBa85c2Aabaf6EF5c50120"
      abi: ResourceAMM
      startBlock: 269189500
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
      abis:
        - name: ResourceAMM
          file: ../out/ResourceAMM.sol/ResourceAMM.json
      eventHandlers:
        - event: Swap(indexed address,address,address,uint256,uint256)
          handler: handleSwap
      file: ./src/mapping.ts

  - kind: ethereum
    name: GameVault
    network: arbitrum-sepolia
    source:
      address: "0xFEcb9C97B3CeA50D69B4f70571b622394441030D"
      abi: GameVaultV1
      startBlock: 269189500
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: GameVaultV1
          file: ../out/GameVaultV1.sol/GameVaultV1.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts

  - kind: ethereum
    name: GameGovernor
    network: arbitrum-sepolia
    source:
      address: "0x602F359Ec3301813a9a450495F9C046c51DfC632"
      abi: GameGovernor
      startBlock: 269189500
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vote
      abis:
        - name: GameGovernor
          file: ../out/GameGovernor.sol/GameGovernor.json
      eventHandlers:
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVote
      file: ./src/mapping.ts
